[system]
type=system
; volitelné, ale užitečné:
endpoint_identifier_order=ip,username,anonymous
; zadej DNS resolver(y):
nameserver=1.1.1.1
nameserver=8.8.8.8

; ===== Transports =====
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=YOUR_PUBLIC_IP
external_signaling_address=YOUR_PUBLIC_IP
allow_reload=yes

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061        ; only used outbound here
verify_server=no
method=tlsv1_2
external_media_address=YOUR_PUBLIC_IP
external_signaling_address=YOUR_PUBLIC_IP
; Asterisk uses system CAs to validate sip.api.openai.com

; ===== Outbound registration to Odorik =====
[od-reg]
type=registration
transport=transport-udp
outbound_auth=od-auth
server_uri=sip:sip.odorik.cz
client_uri=sip:YOUR_SIP_USER@sip.odorik.cz
contact_user=inbound
expiration=300
retry_interval=30

[od-auth]
type=auth
auth_type=userpass
username=YOUR_SIP_USER
password=CHANGE_ME

; --- Odorik trunk (plain RTP) ---
[od-trunk-aor]
type=aor
contact=sip:sip.odorik.cz

[od-trunk-endpoint]
type=endpoint
from_user=YOUR_SIP_USER
from_domain=sip.odorik.cz
transport=transport-udp
aors=od-trunk-aor
outbound_auth=od-auth
context=from-odorik
disallow=all
allow=alaw,ulaw
direct_media=no
media_encryption=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes


; --- Identify Odorik by IP/host ---
[od-identify]
type=identify
endpoint=od-trunk-endpoint
; Either match host (DNS will be resolved and tracked):
match=sip.odorik.cz
; Or match explicit IPs/subnets if you prefer:
; match=81.31.45.51
; match=81.31.45.0/24

; ===== OpenAI “trunk” over TLS/SRTP =====
; We don't register; we just dial a specific TLS host.
[openai-aor]
type=aor
; Contact host is the OpenAI SIP gateway, TLS transport handled by endpoint's transport
;contact=sip:sip.api.openai.com:5061;transport=tls
contact=sip:sip.api.openai.com

[openai-endpoint]
type=endpoint
transport=transport-tls
aors=openai-aor
; We’ll dial with the PROJECT_ID as the user part
disallow=all
allow=alaw,ulaw,opus                   ; adjust to what OpenAI offers; add opus if supported
direct_media=no                   ; anchor media for RTP<->SRTP bridge
media_encryption=sdes             ; or 'dtls' if OpenAI expects DTLS-SRTP
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
context=from-pstn
; outbound_proxy=sip:sip.api.openai.com:5061;transport=tls
; Optional: set srtp_tag_32=yes for stricter SRTP if needed

; (No auth for OpenAI unless they require mutual TLS; usually server-auth only.)

[openai-identify]
type=identify
endpoint=openai-endpoint
match=sip.api.openai.com

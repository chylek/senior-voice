[general]
static=yes
writeprotect=yes
autofallthrough=yes
clearglobalvars=no

; Inbound calls from Odorik (via registration) land here
[from-odorik]
exten => inbound,1,NoOp(Received call from Odorik -> forwarding to OpenAI)
    same => n,Dial(PJSIP/openai-endpoint/sip:YOUR_OPENAI_PROJECT_ID@sip.api.openai.com;transport=tls,90)
    same => n,Hangup()

[from-pstn]
exten => _X.,1,NoOp(Inbound call from OpenAI (unexpected))
    same => n,Hangup()

; Scheduled call (cron -> claudecode/scripts/senior-voice/call-now.sh): Odorik leg answered by the senior
; lands here; bridge to OpenAI with X-Mode: scheduled so the webhook picks the outbound greeting.
[scheduled]
exten => s,1,NoOp(Scheduled call answered -> forwarding to OpenAI)
    same => n,Dial(PJSIP/openai-endpoint/sip:YOUR_OPENAI_PROJECT_ID@sip.api.openai.com,90,b(add-xmode^s^1))
    same => n,Hangup()

[add-xmode]
exten => s,1,Set(PJSIP_HEADER(add,X-Mode)=scheduled)
    same => n,Return()

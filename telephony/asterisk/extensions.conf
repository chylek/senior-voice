[globals]
; last 9 digits of the senior's own phone(s); only these reach the AI. Caller ID is spoofable: this is a
; convenience filter, not authentication (the AI holds the persona's health data).
AI_CALLERS=123456789|987654321

[general]
static=yes
writeprotect=yes
autofallthrough=yes
clearglobalvars=no

; Inbound calls from Odorik (via registration) land here
[from-odorik]
; Only whitelisted callers reach the AI. Everyone else just "rings" here until the parallel
; voicemail branch on the Odorik line (*0851XX*YY, XX = seconds) answers and cancels this leg.
; Whitelisted callers are answered at once, which cancels voicemail before its delay runs out.
exten => inbound,1,NoOp(Received call from Odorik, caller ${CALLERID(num)})
    same => n,GotoIf($[${REGEX("(${AI_CALLERS})$" ${CALLERID(num)})}]?ai)
    same => n,Ringing()
    same => n,Wait(120)
    same => n,Hangup()
    same => n(ai),Answer()
    same => n,Dial(PJSIP/openai-endpoint/sip:YOUR_OPENAI_PROJECT_ID@sip.api.openai.com,90)
    same => n,Hangup()

[from-pstn]
exten => _X.,1,NoOp(Inbound call from OpenAI (unexpected))
    same => n,Hangup()

; Scheduled call (cron -> deploy/call-now.sh): Odorik leg answered by the senior
; lands here; bridge to OpenAI with X-Mode: scheduled so the webhook picks the outbound greeting.
[scheduled]
exten => s,1,NoOp(Scheduled call answered -> forwarding to OpenAI)
    same => n,Dial(PJSIP/openai-endpoint/sip:YOUR_OPENAI_PROJECT_ID@sip.api.openai.com,90,b(add-xmode^s^1))
    same => n,Hangup()

[add-xmode]
exten => s,1,Set(PJSIP_HEADER(add,X-Mode)=scheduled)
    same => n,Return()

[project]
name = "senior-voice"
version = "0.1.0"
license = "MIT"
description = "Czech phone companion for seniors on OpenAI GPT-Live over SIP, with tools, call memory and evals"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "openai>=2",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
]

[project.scripts]
senior-voice-eval = "senior_voice.evals.run:main"

[dependency-groups]
dev = [
    "pre-commit>=4",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003"] # Czech text legitimately uses „“, – and similar characters

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
